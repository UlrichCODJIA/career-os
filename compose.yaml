name: career-os

x-career-os-service: &career-os-service
  build:
    context: .
  restart: unless-stopped
  profiles: [local]

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    profiles: [local]
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U career_os -d career_os]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    <<: *career-os-service
    command: [bun, run, scripts/migrate.ts]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://career_os:local-development-only@postgres:5432/career_os
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: *career-os-service
    command: [bun, run, apps/api/src/index.ts]
    environment:
      CAREER_OS_PROFILE: local
      NETWORK_BOUNDARY: container-loopback
      LOCAL_ONLY: "true"
      DISCOVERY_PUBLIC_BASE_URL: http://127.0.0.1:4100
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://127.0.0.1:4100
      AUTH_MODE: bearer
      AUTH_OPERATOR_TOKEN: ${CAREER_OS_LOCAL_API_TOKEN:?Run bun run local:setup before starting Compose}
      DATABASE_URL: postgresql://career_os:local-development-only@postgres:5432/career_os
      API_HOST: 0.0.0.0
      API_PORT: 4100
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:4100:4100
    networks:
      - frontend
      - backend
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:4100/healthz');if(!r.ok)process.exit(1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *career-os-service
    command: [bun, run, apps/worker/src/index.ts]
    environment:
      CAREER_OS_PROFILE: local
      NETWORK_BOUNDARY: container-loopback
      LOCAL_ONLY: "true"
      DISCOVERY_PUBLIC_BASE_URL: http://127.0.0.1:4101
      DATABASE_URL: postgresql://career_os:local-development-only@postgres:5432/career_os
      ARTIFACT_ROOT: /data/artifacts
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      WORKER_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 4101
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts:/data/artifacts
      - release-evidence:/data/release-evidence
    networks:
      - backend
      - egress
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:4101/healthz');if(!r.ok)process.exit(1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    <<: *career-os-service
    command: [bun, run, apps/web/src/index.ts]
    environment:
      CAREER_OS_PROFILE: local
      NETWORK_BOUNDARY: container-loopback
      LOCAL_ONLY: "true"
      DISCOVERY_PUBLIC_BASE_URL: http://127.0.0.1:3000
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      PUBLIC_API_URL: http://127.0.0.1:4100
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - frontend
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:3000/healthz');if(!r.ok)process.exit(1)"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  frontend:
  backend:
    internal: true
  egress:

volumes:
  artifacts:
  release-evidence:
  postgres-data:
