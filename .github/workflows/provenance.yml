name: Build provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    name: Attest build and SBOM
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
          tar -czf career-os-dist.tar.gz dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: career-os.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Attest build against its SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: career-os-dist.tar.gz
          sbom-path: career-os.spdx.json

      - name: Upload attested build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: career-os-attested-build
          path: |
            career-os-dist.tar.gz
            career-os.spdx.json
          if-no-files-found: error
          retention-days: 30
