name: Bug report
description: Report a reproducible non-security defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include resumes, credentials, private messages, or production data. Follow SECURITY.md for security reports.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal, sanitized steps or a repository fixture.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Deployment profile
      options:
        - local loopback
        - hosted/non-loopback
        - CI/test
        - unknown
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, candidate-private data, employer secrets, and licensed payloads.
          required: true
